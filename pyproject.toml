[project]
name = "wispr-flow-exporter"
version = "0.1.0"
description = "Local, incremental archive of Wispr Flow dictation history, meetings, transcripts and dictionary."
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.13"
dependencies = [
    # The local backend needs neither of these -- the store is SQLite and
    # NDJSON, both of which the standard library reads. httpx is here only for
    # the cloud backend, which is imported lazily, so a local-only run pays
    # nothing for it.
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
wispr-export = "wispr_flow_exporter.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wispr_flow_exporter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
