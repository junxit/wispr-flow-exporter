[project]
name = "wispr-flow-exporter"
version = "0.6.3"
description = "Local, incremental archive of Wispr Flow dictation history, meetings, transcripts and dictionary."
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md"]
requires-python = ">=3.13"
dependencies = [
    # The local backend needs neither of these -- the store is SQLite and
    # NDJSON, both of which the standard library reads. httpx is here for the
    # two remote backends, both lazily imported, so a local-only run pays
    # nothing for it. The MCP client is JSON-RPC written directly against httpx
    # rather than an SDK, so the protocol adds no dependency of its own.
    #
    # Every dependency in this file is pinned exactly, the build backend's
    # included: each is a version the suite has passed on, and a new one
    # arrives only in a commit that bumps it. uv.lock pins what they pull in.
    "httpx==0.28.1",
    "python-dotenv==1.2.4",
]

[project.scripts]
wispr-export = "wispr_flow_exporter.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    # Dev-only. The runtime dependency set stays at two: a local-only run still
    # loads nothing but the standard library.
    "ruff==0.17.1",
    "mypy==2.4.0",
]

[build-system]
# `uv sync` builds the project with this, so unpinned, every install was built
# with whichever hatchling was newest that day.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.uv]
# And what hatchling runs with. Its own requirements are ranges, so every build
# -- `uv build`, and the editable build inside every `uv sync` -- resolved them
# afresh. These are the versions both resolved the day they were pinned. They
# move with hatchling, by hand: tests/test_packaging.py fails on a hatchling
# bump until they have been read again from its METADATA.
build-constraint-dependencies = [
    "packaging==26.3",
    "pathspec==1.1.1",
    "pluggy==1.7.0",
    "tomlkit==0.15.2",
    "trove-classifiers==2026.9.21.13",
]
# mypy 2.4.0 accepts any ast-serialize below 1.0. 0.12.x carries the fixes for
# python/mypy#22085 and #22090; 0.13.x changes how `type: ignore` comments
# parse, for a mypy not yet released. Held here rather than only in uv.lock, so
# no relock moves it, and a mypy that needs 0.13 fails to resolve on the pull
# request that bumps it: then move both together.
constraint-dependencies = ["ast-serialize==0.12.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/wispr_flow_exporter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Strict, so a misspelled marker is an error rather than a test that silently
# never runs -- the failure mode the old `-k "pin or live"` selector had.
addopts = "--strict-markers"
markers = [
    "live: compares the declarations against a local Wispr Flow installation; skips when there is none, so CI never runs it. Run with `pytest -m live` after every app update.",
]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# N because the code already follows PEP 8 naming, the one exception ignored
# below, and D because every docstring in the package is already Google-style.
# Both were being honored by hand; this is what makes them checked.
select = ["E", "F", "I", "N", "UP", "B", "D", "RUF"]
ignore = [
    # The column tuples in schema.py are deliberately packed several names to a
    # line: they are a transcription of a table definition, and one name per
    # line would make a 40-column table unreadable as the table it is.
    "E501",
    # "Exception names should end in Error." Most of what this flags is not a
    # failure: PromptAborted is the operator saying no, Retry and _Renew leave
    # a streaming block so the response closes before the wait, and
    # ResponseTooLarge is a verdict on a response. Naming those "...Error"
    # would describe them wrongly.
    "N818",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests document themselves in prose and do not need module/class docstrings
# enforced the same way, and their long assertion lines carry fixture data.
"tests/*" = ["D100", "D103", "D104"]

[tool.mypy]
python_version = "3.13"
# The package only. The tests are deliberately loose about types -- they build
# malformed records on purpose, which is the point of them.
files = ["src/wispr_flow_exporter"]
strict = true
