version: 2
updates:
  # Python. The dependency set is deliberately small -- the local backend reads
  # SQLite and NDJSON, both of which the standard library handles, so only the
  # cloud backend pulls anything in. Minor and patch bumps are batched into a
  # single weekly pull request.
  #
  # Major bumps are deliberately left ungrouped. Grouping is all-or-nothing:
  # one broken package blocks everything batched with it. That is an acceptable
  # trade for patches, but a major bump of the HTTP library is exactly the
  # change that deserves its own pull request and its own CI run.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Every package uv.lock pins, not only the six pyproject.toml names.
    # Version updates default to direct dependencies, so a package only the
    # lock pins was never proposed: certifi, which httpx brings in, was still
    # 2026.7.22 six days after GHSA-6q48-6c7w-9gw2 was fixed in 2026.10.19,
    # with no pull request and no alert. For uv, "all" adds the dependencies
    # of direct dependencies. For ast-serialize, held in pyproject.toml, the
    # first run reported "No update possible"; that is the hold working.
    allow:
      - dependency-type: "all"
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Workflow actions. These are few, and their releases are almost always major
  # version tags (v4 -> v7), so grouping by update type would defeat the point.
  # Everything goes in one pull request.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
