name: CI

on:
  # Every push, on every branch, and every version tag. It used to be main and
  # pull requests only, so a pushed branch or a tag got no run at all: 0.4.0
  # was tagged and pushed from a branch CI had never seen.
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  schedule:
    # Weekly, so a newly-published CVE in a pinned dependency surfaces even
    # when nothing in the repo has changed.
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Least privilege: nothing here needs write access.
permissions:
  contents: read

# Every action below is pinned to a commit, with the version it is in a
# comment. A tag can be moved to other code; a commit cannot. Dependabot keeps
# the commits and the comments current.
#
# uv and the runner images are pinned too, and Dependabot tracks neither, so
# they move by hand. Unpinned, setup-uv installed whichever uv was newest that
# day -- the last run on main got 0.13.0 -- and a -latest label changes OS
# when GitHub moves it: ubuntu-latest becomes Ubuntu 26.04 in November 2026.
#
# No checkout keeps its token. Nothing after a checkout talks to GitHub, and a
# persisted token sits in .git/config for every later step to read -- the test
# suite and every package it imports included.
#
# The uv cache is skipped on tag pushes. setup-uv's "auto" turns it off for
# tag, release, pull_request_target and workflow_run events, so the run a
# release waits on installs everything fresh against uv.lock's hashes rather
# than from a cache another run wrote. Branch, pull request and scheduled runs
# still cache.

jobs:
  test:
    name: Tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS as well: it is the only platform this tool reads Wispr Flow on,
        # and file modes, flock and loopback sockets are all exercised here.
        os: [ubuntu-24.04, macos-26]
        # Pinned rather than left to float. Without this uv resolves whatever
        # the newest interpreter satisfying `requires-python` happens to be on
        # the day the job runs, so the declared floor was never exercised and
        # the tested version could change between two runs of the same commit.
        # One entry per released minor version `requires-python` admits.
        python-version: ["3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: auto
          python-version: ${{ matrix.python-version }}

      - name: Sync (locked)
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest -q

  checks:
    name: Lint and types
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: auto
          python-version: "3.13"

      - name: Sync (locked)
        run: uv sync --locked --dev

      # Lint and types only. `ruff format` is deliberately not run: it would
      # reflow the column tuples in schema.py, which are packed several names
      # to a line because they transcribe a table definition and read as one.
      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release binary, pinned by version and by the SHA-256 its release
      # publishes, and checked before it runs. google/osv-scanner-action was
      # pinned to a commit, but its action.yml runs a container image by tag,
      # and a tag can be moved: the commit pinned the wrapper, not what ran.
      # Dependabot tracks neither the version nor the checksum, so both move
      # by hand, with uv and the runners: take the new checksum from the
      # osv-scanner_linux_amd64 line of that release's osv-scanner_SHA256SUMS.
      - name: Install osv-scanner
        env:
          OSV_SCANNER_VERSION: "2.7.0"
          OSV_SCANNER_SHA256: "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b"
        run: |
          curl -fsSL --proto '=https' --retry 3 -o "$RUNNER_TEMP/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  ${RUNNER_TEMP}/osv-scanner" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/osv-scanner"

      # osv-scanner reads uv.lock natively and asks the OSV database at scan
      # time, so pinning the scanner does not freeze the advisories. Fails the
      # job if any pinned dependency has a known advisory, or if the database
      # cannot be reached.
      - name: Scan uv.lock for known vulnerabilities
        run: |
          "$RUNNER_TEMP/osv-scanner" scan source --lockfile=uv.lock
